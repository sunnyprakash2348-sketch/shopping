<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Website</title>
  <style>
    body{
        background-color:aliceblue
    }
    
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    }
    .header {
    display: flex;
    justify-content:space-between;
    align-items: center;
    background: #333;
    color: #fff;
    padding: 15px 30px;
    }

    .logo {
    font-size: 1.5em;
    font-weight: bold;
    }

    .nav a {
    color: #fff;
    text-decoration: none;
    margin: 0 15px;
    font-size: 1em;
    }

    .nav a:hover {
    color: #00eeff;
    }

    .products {
    padding: 40px;
    text-align: center;
    }

    .products h1 {
    margin-bottom: 20px;
    font-size: 2em;
    color: #333;
    }

    .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    }

    .card {
    background: #f9f9f9;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    text-align: center;
    }

    .card img {
    width: 100%;
    border-radius: 8px;
    }

    .card h2 {
    margin: 10px 0;
    font-size: 1.2em;
    color: #333;
    }

    .card p {
    color: #555;
    margin-bottom: 10px;
    }

    .card button {
    background: #575959;    
    color: #fff;
    border: none;
    padding: 10px 15px;
    border-radius: 5px;
    cursor: pointer;
    }

    .card button:hover {
    background: #ff3705;
    }


  </style>
</head>
<body>
  <header class="header">
    <div class="logo">shop..</div>
    <nav class="nav">
      <a href="#">Home</a>
      <a href="#">Products</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>
  <section class="products">
    <h1>Our Products</h1>
    <div class="product-grid">
      <div class="card">
        <img src="https://images.pexels.com/photos/37791517/pexels-photo-37791517.jpeg" alt="Product 1">
        <h2>Product 1</h2>
        <p>₹20.00</p>
        <button>Add to Cart</button>
      </div>
      <div class="card">
        <img src="https://images.pexels.com/photos/37791517/pexels-photo-37791517.jpeg" alt="Product 2">
        <h2>Product 2</h2>
        <p>₹20.00</p>
        <button>Add to Cart</button>
      </div>
      <div class="card">
        <img src="https://images.pexels.com/photos/37791517/pexels-photo-37791517.jpeg" alt="Product 3">
        <h2>Product 3</h2>
        <p>₹20.00</p>
        <button>Add to Cart</button>
      </div>
      <div class="card">
        <img src="https://images.pexels.com/photos/37791517/pexels-photo-37791517.jpeg" alt="Product 4">
        <h2>Product 4</h2>
        <p>₹20.00</p>
        <button>Add to Cart</button>
      </div>
      <div class="card">
        <img src="https://images.pexels.com/photos/37791517/pexels-photo-37791517.jpeg" alt="Product 5">
        <h2>Product 5</h2>
        <p>₹20.00</p>
        <button>Add to Cart</button>
      </div>
      <div class="card">
        <img src="https://images.pexels.com/photos/37791517/pexels-photo-37791517.jpeg" alt="Product 6">
        <h2>Product 6</h2>
        <p>₹20.00</p>
        <button>Add to Cart</button>
      </div>
    </div>
  </section>
</body>
</html>
